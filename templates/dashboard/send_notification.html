{% extends "base.html" %}
{% block content %}
<div class="form-card mt-5">
    <h3>📢 Send Notification to {{ course.title }}</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" class="form-input" required placeholder="e.g., Live Class Tomorrow">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea name="message" class="form-input" rows="4" required placeholder="We have a live meeting at 4 PM tomorrow. Please join."></textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Send Alert</button>
        <a href="{% url 'dashboard' %}" class="btn btn-outline w-100 mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
