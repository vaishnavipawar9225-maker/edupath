{% extends "base.html" %}
{% block title %}Request Meeting{% endblock %}
{% block content %}
<div class="form-card" style="max-width: 500px;">
  <h2>📅 Request a Meeting</h2>
  <p style="color: var(--g500); font-size: 14px; margin-bottom: 24px;">Select a teacher and choose a preferred date and time.</p>
  
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Select Teacher</label>
      {{ form.teacher }}
    </div>
    <div class="form-group">
      <label>Subject</label>
      {{ form.subject }}
    </div>
    <div class="form-group">
      <label>Date</label>
      {{ form.date }}
    </div>
    <div class="form-group">
      <label>Time</label>
      {{ form.time }}
    </div>
    
    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <a href="{% url 'parent_meetings' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex: 1;">Send Request</button>
    </div>
  </form>
</div>
{% endblock %}
